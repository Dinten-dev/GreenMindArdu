name: Direct transport tests
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Test PCM and concurrent bounded queue
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread tests/direct_transport/test_core.cpp -o /tmp/direct-core-test
          /tmp/direct-core-test
  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install platformio==6.1.19
      - name: Compile separate test firmware only
        run: platformio run --project-dir examples/direct_sensor
