name: Direct transport tests
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Test PCM and concurrent bounded queue
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread tests/direct_transport/test_core.cpp -o /tmp/direct-core-test
          /tmp/direct-core-test
      - name: Test raw ADC encoding, cadence, gaps and profile spool
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined tests/direct_transport/test_raw400.cpp -o /tmp/raw400-test
          /tmp/raw400-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined tests/direct_transport/test_raw400_acquisition.cpp -o /tmp/raw400-acquisition-test
          /tmp/raw400-acquisition-test
      - name: Test demand preview, rail windows and raw acquisition priority
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined tests/direct_transport/test_live_preview.cpp -o /tmp/live-preview-test
          /tmp/live-preview-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined tests/direct_transport/test_demand_live_acquisition.cpp -o /tmp/demand-acquisition-test
          /tmp/demand-acquisition-test
      - name: Test real 20 ms mains filter
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/direct_transport/test_mains_average.cpp -o /tmp/mains-test
          /tmp/mains-test
      - name: Test truthful upload display states
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/direct_transport/test_upload_status.cpp -o /tmp/upload-status-test
          /tmp/upload-status-test
      - name: Test bounded setup windows and retained pairing
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/direct_transport/test_setup_window.cpp -o /tmp/setup-window-test
          /tmp/setup-window-test
      - name: Test retained PCM through outages and counter rollover
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined tests/direct_transport/test_pcm_spool.cpp -o /tmp/pcm-spool-test
          /tmp/pcm-spool-test
      - name: Test durable replay, corruption and DMA raw cadence
        run: |
          for test in flash_journal raw400_dma_stride; do
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined tests/direct_transport/test_${test}.cpp -o /tmp/${test}
            /tmp/${test}
          done
      - name: Test OTA offer identity, profile, image and size guards
        run: |
          python -m pip install pyserial==3.5
          g++ -std=c++17 -Wall -Wextra -Werror tests/direct_transport/test_ota_contract.cpp -o /tmp/ota-contract
          /tmp/ota-contract
          python -m unittest discover -s tests -v
      - name: Test boot identity persistence failures
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/direct_transport/test_boot_identity.cpp -o /tmp/boot-identity-test
          /tmp/boot-identity-test
      - name: Test isolated Staging and Production targets
        run: |
          for flags in "" "-DGREENMIND_CLOUD_PRODUCTION=1" "-DGREENMIND_DIRECT_PROTOCOL_VERSION=2" "-DGREENMIND_CLOUD_PRODUCTION=1 -DGREENMIND_DIRECT_PROTOCOL_VERSION=2" "-DGREENMIND_DIRECT_DURABLE_SPOOL=1" "-DGREENMIND_DIRECT_DURABLE_SPOOL=1 -DGREENMIND_CLOUD_PRODUCTION=1"; do
            g++ -std=c++17 -Wall -Wextra -Werror $flags tests/direct_transport/test_cloud_config.cpp -o /tmp/cloud-config-test
            /tmp/cloud-config-test
          done
          for flags in "-DGREENMIND_DIRECT_OTA=1" "-DGREENMIND_DIRECT_PROTOCOL_VERSION=2"; do
            if g++ -std=c++17 -DGREENMIND_DIRECT_DURABLE_SPOOL=1 $flags -c tests/direct_transport/test_cloud_config.cpp -o /tmp/invalid-durable.o; then
              echo "Unsupported durable target was accepted"
              exit 1
            fi
          done
  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install platformio==6.1.19
      - name: Compile separate Staging and Production firmware
        run: platformio run --project-dir examples/direct_sensor -e direct_biolingo_test -e direct_biolingo_production -e direct_biolingo_n8r8_test -e direct_biolingo_n8r8_production -e direct_biolingo_v22_psram_test -e direct_biolingo_v22_psram_production -e direct_biolingo_v22_psram_ota_production -e direct_biolingo_v22_psram_ota_v2_candidate -e direct_biolingo_raw400_adc_selftest -e direct_biolingo_n16_flash_test -e direct_biolingo_n16_flash_production
      - name: Test typed acknowledgements and long-running retry clock
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I examples/direct_sensor/.pio/libdeps/direct_biolingo_production/ArduinoJson/src tests/direct_transport/test_acknowledgement.cpp -o /tmp/acknowledgement-test
          /tmp/acknowledgement-test
          # Keep optimized sanitizers and strict warnings; GCC misdiagnoses
          # ArduinoJson's default iterator when inlining this host-only test.
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -isystem examples/direct_sensor/.pio/libdeps/direct_biolingo_production/ArduinoJson/src tests/direct_transport/test_live_network.cpp -o /tmp/live-network-test
          /tmp/live-network-test
          /tmp/live-network-test --cold-handshake
