name: Direct transport tests
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Test PCM and concurrent bounded queue
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread tests/direct_transport/test_core.cpp -o /tmp/direct-core-test
          /tmp/direct-core-test
      - name: Test truthful upload display states
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/direct_transport/test_upload_status.cpp -o /tmp/upload-status-test
          /tmp/upload-status-test
      - name: Test isolated Staging and Production targets
        run: |
          for flags in "" "-DGREENMIND_CLOUD_PRODUCTION=1"; do
            g++ -std=c++17 -Wall -Wextra -Werror $flags tests/direct_transport/test_cloud_config.cpp -o /tmp/cloud-config-test
            /tmp/cloud-config-test
          done
  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install platformio==6.1.19
      - name: Compile separate Staging and Production firmware
        run: platformio run --project-dir examples/direct_sensor -e direct_biolingo_test -e direct_biolingo_production
