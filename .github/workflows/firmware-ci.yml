name: Firmware CI

on:
  push:
    paths:
      - ".clang-format"
      - ".github/workflows/firmware-ci.yml"
      - "GreenMindFirmware_Biolingo/**"
      - "tests/**"
  pull_request:
    paths:
      - ".clang-format"
      - ".github/workflows/firmware-ci.yml"
      - "GreenMindFirmware_Biolingo/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  verify-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"

      - name: Install pinned build and format tools
        run: >-
          python -m pip install --disable-pip-version-check
          platformio==6.1.19 clang-format==18.1.8

      - name: Run security invariant tests
        run: python -m unittest discover -s tests -v

      - name: Check active firmware formatting
        shell: bash
        run: |
          mapfile -d '' sources < <(
            find GreenMindFirmware_Biolingo/src -type f \
              \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
              -print0
            if [[ -d GreenMindFirmware_Biolingo/include ]]; then
              find GreenMindFirmware_Biolingo/include -type f \
                \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
                -print0
            fi
          )
          clang-format --dry-run --Werror "${sources[@]}"

      - name: Build ESP32-S3 release firmware
        run: pio run -d GreenMindFirmware_Biolingo
