name: Publish Direct USB release
on:
  push:
    tags: ['direct-v*']
permissions:
  contents: write
concurrency:
  group: direct-firmware-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify version, layouts and transport
        run: |
          python -m unittest discover -s tests -v
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread tests/direct_transport/test_core.cpp -o /tmp/direct-core
          /tmp/direct-core
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined tests/direct_transport/test_pcm_spool.cpp -o /tmp/pcm-spool
          /tmp/pcm-spool
          g++ -std=c++17 -Wall -Wextra -Werror tests/direct_transport/test_upload_status.cpp -o /tmp/upload-status
          /tmp/upload-status
          for flags in "" "-DGREENMIND_CLOUD_PRODUCTION=1"; do
            g++ -std=c++17 -Wall -Wextra -Werror $flags tests/direct_transport/test_cloud_config.cpp -o /tmp/cloud-config
            /tmp/cloud-config
          done
          python - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('examples/direct_sensor/src/CloudConfig.h').read_text().split('#else')[0]
          version=re.search(r'firmwareVersion\[\] = "direct-hotspot-v([^"]+)-production"',text).group(1)
          assert os.environ['GITHUB_REF_NAME']=='direct-v'+version, 'Tag and firmware version differ'
          PY
      - name: Build Production N16R8 and package
        run: |
          python -m pip install platformio==6.1.19
          platformio run --project-dir examples/direct_sensor -e direct_biolingo_v22_psram_production
          g++ -std=c++17 -Wall -Wextra -Werror -I examples/direct_sensor/.pio/libdeps/direct_biolingo_v22_psram_production/ArduinoJson/src tests/direct_transport/test_acknowledgement.cpp -o /tmp/ack
          /tmp/ack
          python tools/package_direct_release.py --source-commit "$GITHUB_SHA" --output release
      - name: Publish immutable version and update Direct-specific download
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$DIRECT_TAG" == *-rc* ]]; then flags+=(--prerelease); fi
          printf '%s\n' 'Manual USB application only for Biolingo v22 N16R8.' '380 Hz raw PCM; volatile PSRAM. Hardware acceptance required per device.' 'Use docs/direct-upgrade.md; preserve existing layout and private backups.' > notes.txt
          gh release create "$DIRECT_TAG" release/* --verify-tag --title "Direct-to-Cloud $DIRECT_TAG" --notes-file notes.txt "${flags[@]}"
          if ! gh release view direct-latest >/dev/null 2>&1; then
            gh release create direct-latest --target "$GITHUB_SHA" --latest=false --title 'Latest Direct-to-Cloud USB download' --notes-file notes.txt "${flags[@]}"
          fi
          printf '\nCurrent version: %s\nSource: %s\n' "$DIRECT_TAG" "$GITHUB_SHA" >> notes.txt
          gh release edit direct-latest --notes-file notes.txt --latest=false
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/direct-latest" -f sha="$GITHUB_SHA" -F force=true
          if [[ "$DIRECT_TAG" == *-rc* ]]; then gh release edit direct-latest --prerelease; else gh release edit direct-latest --prerelease=false; fi
          gh release upload direct-latest release/* --clobber
