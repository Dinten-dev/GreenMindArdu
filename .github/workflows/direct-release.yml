name: Validate Direct release candidate
on:
  push:
    tags: ['direct-v*', 'direct-2.*']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify USB layout and OTA contract
        run: |
          python -m unittest discover -s tests -v
          g++ -std=c++17 -Wall -Wextra -Werror tests/direct_transport/test_ota_contract.cpp -o /tmp/ota-contract
          /tmp/ota-contract
      - name: Build software candidate
        run: |
          python -m pip install platformio==6.1.19
          platformio run --project-dir examples/direct_sensor -e direct_biolingo_v22_psram_ota_production
      # CI builds are not hardware acceptance and may have different binary hashes.
      # Publication uses package_direct_ota_release.py with the exact tested binary
      # and physical report; only that package may replace direct-latest.
